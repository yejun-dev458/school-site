<!DOCTYPE html>
<html>
<head>
  <title>우리 반 사이트</title>

  <!-- 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">

  <!-- 스타일 -->
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: #f4f6f9;
    }

    header {
      background: #4a6cf7;

      display: flex;
      justify-content: center;

  <title>우리 반 사이트</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f9;
}

header {
  background: #4a6cf7;
  color: white;
  padding: 15px;
  font-size: 22px;
  text-align: center;
}

nav {
  background: white;
  padding: 10px;
  display: flex;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

nav button {
  background: #4a6cf7;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

nav button:hover {
  background: #2f4ed8;
}

.container {
  padding: 20px;
  max-width: 800px;
  margin: auto;
}

.hidden {
  display: none;
}

#loginBox {
  max-width: 300px;
  margin: 100px auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

button {
  padding: 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

li button {
  margin-left: 10px;
  background: red;
  color: white;
}
</style>

<body>

<!-- 로그인 -->
<div id="loginBox">
  <h2>로그인</h2>
  <input id="loginId" placeholder="아이디">
  <input id="loginPw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>
</div>

<header>📚 우리 반 사이트</header>

<nav>
  <button onclick="showPage('home')">홈</button>
  <button onclick="showPage('notice')">공지사항</button>
  <button onclick="showPage('timetable')">시간표</button>
  <button onclick="showPage('board')">자유게시판</button>
</nav>

<div class="container">

  <div id="home">
    <h2>홈</h2>
    <p>우리 반 사이트에 오신 걸 환영합니다!</p>
  </div>

  <div id="notice" class="hidden">
    <h2>공지사항</h2>
    <p>관리자 기능은 나중에 추가</p>
  </div>

  <div id="timetable" class="hidden">
    <h2>시간표</h2>
    <p>여기에 시간표 넣으면 됨</p>
  </div>

  <div id="board" class="hidden">
    <h2>자유게시판</h2>

    <!-- 비밀번호 변경 -->
    <h3>비밀번호 변경</h3>
    <input id="newPw" placeholder="새 비밀번호">
    <button onclick="changePassword()">변경</button>

    <hr>

    <input id="title" placeholder="제목">
    <textarea id="content" placeholder="내용"></textarea>
    <button onclick="writePost()">작성</button>

    <ul id="list"></ul>
  </div>

</div>

<script>

let currentUser = null;

function showPage(page) {
  const pages = ['home', 'notice', 'timetable', 'board'];

  pages.forEach(p => {
    document.getElementById(p).classList.add('hidden');
  });

  document.getElementById(page).classList.remove('hidden');
}

// 로그인
async function login() {
  const id = document.getElementById('loginId').value;
  const password = document.getElementById('loginPw').value;

  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, password })
  });

  const data = await res.json();

  if (data.success) {
    currentUser = id;
    alert("로그인 성공!");
    document.getElementById('loginBox').style.display = 'none';
  } else {
    alert("아이디 또는 비밀번호 틀림");
  }
}

// 비밀번호 변경
async function changePassword() {
  const newPassword = document.getElementById('newPw').value;

  const res = await fetch('/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id: currentUser,
      newPassword: newPassword
    })
  });

  const data = await res.json();

  if (data.success) {
    alert("비밀번호 변경 완료!");
  } else {
    alert("실패");
  }
}

// 글 작성
async function writePost() {
  if (!currentUser) {
    alert("로그인 먼저 하세요");
    return;
  }

  const title = document.getElementById('title').value;
  const content = document.getElementById('content').value;

  await fetch('/post', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, content })
  });

  loadPosts();
}

// 글 목록
async function loadPosts() {
  const res = await fetch('/posts');
  const data = await res.json();

  const list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach((post, index) => {
    const li = document.createElement('li');
    li.innerText = post.title + " - " + post.content;

    if (currentUser === 'admin') {
      const btn = document.createElement('button');
      btn.innerText = "삭제";
      btn.onclick = () => deletePost(index);
      li.appendChild(btn);
    }

    list.appendChild(li); // ⭐ 이거 반드시 있어야 함
  });
}
loadPosts();

async function deletePost(index) {
  console.log("삭제 클릭됨", index);

  await fetch('/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index })
  });

  loadPosts();
}

</script>

</body>
</html>
